; ---------------------------------------------------------------------------
; FAM VAULT — upload limits
;
; The stock php:8.4-apache image ships the production php.ini defaults:
;
;   upload_max_filesize = 2M    -> any photo/video over 2 MB is silently
;                                   discarded by PHP before Laravel sees it
;   post_max_size       = 8M    -> the whole POST body is thrown away over 8 MB
;
; That is why big uploads failed on the live site (Laravel answered
; "The file field is required" and the browser saw a CORS-blocked error:
; the response came from the wrong layer). Laravel's own validation cap in
; PhotoController is `max:204800` (200 MB), so PHP must be allowed at least
; that much — with a little headroom for the multipart envelope.
; ---------------------------------------------------------------------------

upload_max_filesize = 205M
post_max_size = 210M

; Parsing + forwarding a 200 MB body to the Cloudflare Worker takes time.
max_execution_time = 600
max_input_time = 600

; WorkerClient streams the file from disk (never file_get_contents), so this
; only needs headroom for Laravel itself + a chunk of the multipart envelope.
memory_limit = 256M

; Written by the Fly deploy; Apache/mod_php reads /usr/local/etc/php/conf.d.
