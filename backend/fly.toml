# fly.toml — FAM VAULT API (Laravel). App: famvault-backend
#
#   fly launch --name famvault-backend --no-deploy --yes
#   fly volumes create famvault_data --region ams --size 1 --yes
#   fly secrets set APP_KEY="$(php artisan key:generate --show)"
#   fly deploy --ha=false
#
app = "famvault-backend"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

# Non-secret configuration. APP_KEY is a secret (fly secrets set ...) and is
# deliberately NOT here.
[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://famvault-backend.fly.dev"

  # SQLite lives on the mounted volume so it survives redeploys.
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/var/www/html/storage/database.sqlite"

  SESSION_DRIVER = "database"
  CACHE_STORE = "database"
  QUEUE_CONNECTION = "sync"
  LOG_CHANNEL = "stack"
  LOG_LEVEL = "warning"

  # Cloudflare Worker in front of R2. No R2 credentials exist here — the
  # Worker keeps them server-side.
  WORKER_API_URL = "https://famvault-r2.famvault.workers.dev"
  WORKER_ROLE_HEADER = "X-Famvault-Role"
  WORKER_MEMBER_ROLE = "member"
  WORKER_TIMEOUT = "15"
  R2_BUCKET_NAME = "familyvault"
  WORKER_CA_BUNDLE = ""

  # Family / roles.
  FAMVAULT_ADMIN_ID = "herman"
  FAMVAULT_SESSION_DAYS = "30"

  # Frontend origin (Netlify). https://*.netlify.app is also allowed as a regex
  # pattern in config/cors.php, so preview URLs and renamed sites work without
  # editing this.
  FRONTEND_URL = "https://kashifamily.netlify.app"
  CORS_ALLOWED_ORIGINS = "https://kashifamily.netlify.app"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[mounts]]
  source = "famvault_data"
  destination = "/var/www/html/storage"
  initial_size = "1GB"
